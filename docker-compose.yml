services:
  dipstick:
    build: .
    container_name: dipstick
    ports:
      - "3125:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:./data/dipstick.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - dipstick-data:/app/data
      - dipstick-uploads:/app/uploads
    restart: unless-stopped

volumes:
  dipstick-data:
  dipstick-uploads:
